<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teaser | ThatLoFiModding</title>
    <style>
        :root {
            --bg-color: #e5d9bc;
            --text-color: #2d3324;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Georgia', serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            flex-direction: column; /* Sorgt dafür, dass Elemente untereinander stehen */
        }

        .container {
            border: 1px solid var(--text-color);
            padding: 40px 60px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 2;
        }

        .logo-small {
            max-width: 150px;
            opacity: 0.7;
            margin-bottom: 20px;
            display: block; /* Verhindert Inline-Lücken */
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0;
        }

        .status {
            margin-top: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #8b4513;
            text-transform: uppercase;
        }

        .back {
            margin-top: 30px;
            font-size: 0.7rem;
            text-decoration: none;
            color: var(--text-color);
            border-bottom: 1px solid var(--text-color);
            display: inline-block;
        }

        footer { 
            position: absolute;
            bottom: 20px;
            width: 100%;
            font-size: 0.8rem; 
            letter-spacing: 2px; 
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="LoFi" class="logo-small">
        <h1>This Is Just A Teaser</h1>
        <div class="status">Development Phase: Got The Idea</div>
        <a href="mods.html" class="back">GO BACK</a>
    </div>

    <footer>&copy; 2026 THATLOFIMODDING | QUALITY OVER SPEED</footer>
</body>
</html>
