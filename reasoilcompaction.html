<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Soil Compaction | ThatLoFiModding</title>
    <style>
        :root {
            --bg-color: #e5d9bc;
            --text-color: #2d3324;
            --accent-color: #8b4513;
            --card-bg: rgba(255, 255, 255, 0.2);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Georgia', serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding-bottom: 50px;
        }

        /* Navbar Style */
        nav { 
            margin-top: 30px; 
            background: var(--text-color); 
            padding: 12px 40px; 
            border-radius: 50px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 90%;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        nav a { 
            color: var(--bg-color); 
            text-decoration: none; 
            font-weight: bold; 
            margin: 5px 20px; 
            text-transform: uppercase; 
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        nav a:hover { color: #fff; opacity: 0.8; }

        .container {
            border: 1px solid var(--text-color);
            padding: 40px;
            background: var(--card-bg);
            max-width: 800px;
            width: 90%;
            margin-top: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .logo-small {
            max-width: 120px;
            opacity: 0.8;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--text-color);
            padding-bottom: 15px;
        }

        .status-badge {
            background: var(--accent-color);
            color: white;
            padding: 5px 15px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            display: inline-block;
        }

        /* Dropdown Menu Styles */
        .dropdown {
            text-align: left;
            margin-top: 15px;
            border: 1px solid var(--text-color);
            background: rgba(255, 255, 255, 0.1);
        }

        .dropdown-header {
            padding: 15px 20px;
            cursor: pointer;
            background: var(--text-color);
            color: var(--bg-color);
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .dropdown-content {
            padding: 20px;
            display: none;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .dropdown.active .dropdown-content {
            display: block;
        }

        .dropdown.active .dropdown-header {
            background: var(--accent-color);
        }

        /* Images and Charts */
        .img-container {
            margin: 15px 0;
            text-align: center;
        }

        .mod-img {
            max-width: 100%;
            height: auto;
            border: 1px solid var(--text-color);
            filter: sepia(20%);
        }

        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .chart-grid { grid-template-columns: 1fr; }
            .container { padding: 20px; margin-top: 20px; }
        }

        .back-link {
            margin-top: 40px;
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.8rem;
            border-bottom: 1px solid var(--text-color);
            display: inline-block;
        }

        ul { padding-left: 20px; }
        li { margin-bottom: 8px; }
        .highlight { color: var(--accent-color); font-weight: bold; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="mods.html">Gallery</a>
        <a href="about.html">Our Story</a>
        <a href="roadmap.html">Roadmaps</a>
    </nav>

    <div class="container">
        <img src="logo.png" alt="ThatLoFiModding" class="logo-small">
        <h1>Realistic Soil Compaction</h1>
        <div class="status-badge">Development: 2% Complete</div>

        <!-- Menu 1: Diagrams -->
        <div class="dropdown">
            <div class="dropdown-header">1. Getting The Idea <span>+</span></div>
            <div class="dropdown-content">
                <p>Thinking of the core logic of the mod.</p>
            </div>
        </div>

        <a href="RSCteaser.html" class="back-link">< GO BACK</a>
        <br>
        <a href="mods.html" class="back-link">< BACK TO GALLERY</a>
    </div>

    <script>
        document.querySelectorAll('.dropdown-header').forEach(header => {
            header.addEventListener('click', () => {
                header.parentElement.classList.toggle('active');
                const icon = header.querySelector('span');
                icon.innerText = header.parentElement.classList.contains('active') ? '-' : '+';
            });
        });
    </script>

    <footer style="margin-top: 40px; font-size: 0.8rem; letter-spacing: 2px; opacity: 0.6;">
        &copy; 2026 THATLOFIMODDING | QUALITY OVER SPEED
    </footer>

</body>
</html>
